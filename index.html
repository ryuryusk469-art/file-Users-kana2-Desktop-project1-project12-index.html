<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かぞくの単語練習</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .family-btn { 
          transition: all 0.15s ease; 
          background: linear-gradient(135deg, rgba(255,200,221,0.9), rgba(255,182,193,0.8)) !important;
          color: #ff89b4;
          box-shadow: 0 4px 12px rgba(255, 137, 180, 0.2);
          border: 2px solid rgba(255,255,255,0.4) !important;
        }
        .family-btn:hover { 
          transform: scale(1.1); 
          box-shadow: 0 6px 18px rgba(255, 137, 180, 0.4);
        }
        .family-btn:active { transform: scale(0.95); }
        .modal-overlay { transition: opacity 0.2s ease; }
        .modal-overlay.hidden { opacity: 0; pointer-events: none; }
        
        /* ルビ（ふりがな）のスタイル調整 */
        rt {
          font-size: 0.55em;
          letter-spacing: 0.05em;
          padding-bottom: 0.2em;
          color: #de6b97;
          font-weight: 500;
        }
  </style>
</head>
<body class="min-h-screen w-full" style="background: linear-gradient(135deg, rgba(255, 182, 193, 0.3), rgba(255, 192, 203, 0.2), rgba(255, 228, 225, 0.3));">

  <header class="pt-8 pb-4 text-center">
   <h1 class="text-3xl font-bold" style="color: rgb(255, 255, 255); font-size: 32px;">かぞくの単語表</h1>
   <p class="mt-2 opacity-80" style="color: rgb(255, 255, 255); font-size: 15px;">タップして発音を聞いてみよう！</p>
  </header>

  <main class="max-w-2xl mx-auto px-4 pb-12">
   <div id="family-grid" class="grid grid-cols-2 gap-3"></div>
  </main>

  <div id="modal" class="modal-overlay hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" role="dialog" aria-modal="true">
   <div class="rounded-2xl p-8 text-center shadow-2xl max-w-xs w-full mx-4" style="background: rgb(255, 245, 248); color: rgb(90, 90, 126);">
    
    <div class="flex flex-col items-center justify-center gap-2 mb-4 cursor-pointer group" onclick="playCurrentContent()">
        <ruby id="modal-ruby-text" class="text-4xl font-bold text-[#ff89b4] group-hover:scale-105 transition-transform">
          <span id="modal-kana"></span><rt id="modal-furi"></rt>
        </ruby>
        <span class="text-xl text-[#ff89b4] opacity-70 group-hover:opacity-100 mt-2">🔊 Tap to Listen</span>
    </div>

    <div class="py-2 border-t border-pink-200 mt-2">
        <p id="modal-meaning" class="text-xl font-bold text-slate-700"></p>
    </div>
    
    <button class="mt-6 px-6 py-2 rounded-lg text-sm font-medium transition-all hover:opacity-90" onclick="closeModal()" style="background: rgb(255, 137, 180); color: rgb(255, 255, 255); font-size: 16px;">とじる</button>
   </div>
  </div>

  <script>
        // 家族の単語データ
        const familyData = [
            ["おじいさん", "ojiisan", "Grandfather"],
            ["おばあさん", "obaasan", "Grandmother"],
            ["おとうさん", "otoosan", "Father"],
            ["おかあさん", "okaasan", "Mother"],
            ["おにいさん", "oniisan", "Older brother"],
            ["おねえさん", "oneesan", "Older sister"],
            ["おとうと", "otooto", "Younger brother"],
            ["いもうと", "imooto", "Younger sister"]
        ];

        const grid = document.getElementById('family-grid');
        const modal = document.getElementById('modal');
        
        let currentWord = "";

        // ボタンの自動生成
        familyData.forEach(([kana, furi, meaning]) => {
            const btn = document.createElement('button');
            btn.className = 'family-btn rounded-2xl p-4 flex flex-col items-center justify-center text-xl font-bold cursor-pointer border-2 min-h-[90px]';
            
            btn.innerHTML = `<ruby>${kana}<rt>${furi}</rt></ruby>`;
            
            btn.setAttribute('aria-label', kana);
            btn.addEventListener('click', () => openModal(kana, furi, meaning));
            grid.appendChild(btn);
        });

        // 音声再生ロジック
        function playFamilySound(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                
                const utter = new SpeechSynthesisUtterance(word);
                utter.lang = 'ja-JP';
                utter.rate = 0.8; 
                
                window.speechSynthesis.speak(utter);
            }
        }

        function openModal(kana, furi, meaning) {
            currentWord = kana;
            
            document.getElementById('modal-kana').textContent = kana;
            document.getElementById('modal-furi').textContent = furi;
            document.getElementById('modal-meaning').textContent = meaning;
            
            modal.classList.remove('hidden');
            
            playFamilySound(kana);
        }

        function playCurrentContent() {
            if (currentWord) {
                playFamilySound(currentWord);
            }
        }

        function closeModal() {
            modal.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
  </script>
</body>
</html>
